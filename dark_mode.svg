<svg width="500" height="320" viewBox="0 0 500 320" xmlns="http://www.w3.org/2000/svg" font-family="'Fira Code','Consolas',monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <style>
      .title-bar { fill: #21262d; }
      .dot { r: 5; }
      .label { fill: #7d8590; font-size: 13px; }
      .value { fill: #58a6ff; font-size: 13px; font-weight: 600; }
      .prompt { fill: #3fb950; font-size: 13px; }
      .cmd { fill: #c9d1d9; font-size: 13px; }
      .header { fill: #f0f6fc; font-size: 15px; font-weight: 700; }
      .line { opacity: 0; animation: reveal 0.5s ease forwards; }
      @keyframes reveal { to { opacity: 1; } }
      .l1 { animation-delay: 0.1s; } .l2 { animation-delay: 0.3s; }
      .l3 { animation-delay: 0.5s; } .l4 { animation-delay: 0.7s; }
      .l5 { animation-delay: 0.9s; } .l6 { animation-delay: 1.1s; }
      .l7 { animation-delay: 1.3s; } .l8 { animation-delay: 1.5s; }
      .cursor { animation: blink 1s step-end infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect width="500" height="320" rx="10" fill="url(#bg)" stroke="#30363d" stroke-width="1"/>

  <rect width="500" height="34" rx="10" class="title-bar"/>
  <rect y="24" width="500" height="10" class="title-bar"/>
  <circle class="dot" cx="20" cy="17" fill="#ff5f56"/>
  <circle class="dot" cx="38" cy="17" fill="#ffbd2e"/>
  <circle class="dot" cx="56" cy="17" fill="#27c93f"/>
  <text x="250" y="21" text-anchor="middle" class="header">k-is-sick@github: ~/stats</text>

  <text x="24" y="62" class="prompt line l1">$ <tspan class="cmd">whoami --github</tspan></text>
  <text x="24" y="86" class="label line l1">coding since</text>
  <text x="476" y="86" text-anchor="end" class="value line l1">2 yrs, 34 days</text>

  <text x="24" y="118" class="prompt line l2">$ <tspan class="cmd">git log --author=k-is-sick --all</tspan></text>
  <text x="24" y="142" class="label line l2">total commits (last year window sum)</text>
  <text x="476" y="142" text-anchor="end" class="value line l2">53</text>

  <text x="24" y="174" class="prompt line l3">$ <tspan class="cmd">gh repo list --stats</tspan></text>
  <text x="24" y="198" class="label line l3">public repos owned</text>
  <text x="476" y="198" text-anchor="end" class="value line l3">12</text>
  <text x="24" y="218" class="label line l4">repos contributed to</text>
  <text x="476" y="218" text-anchor="end" class="value line l4">13</text>
  <text x="24" y="238" class="label line l5">stars earned</text>
  <text x="476" y="238" text-anchor="end" class="value line l5">4</text>
  <text x="24" y="258" class="label line l6">followers</text>
  <text x="476" y="258" text-anchor="end" class="value line l6">3</text>

  <text x="24" y="286" class="prompt line l7">$ <tspan class="cmd">cloc --diff-report all-repos</tspan></text>
  <text x="24" y="306" class="label line l8">+638,300 / -633,752 lines <tspan fill="#7d8590">(net 4,548)</tspan><tspan class="cmd cursor">_</tspan></text>
</svg>
